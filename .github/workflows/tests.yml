name: Scanner checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run check
      - run: npm test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-dejavu-core
      - name: Browser integration checks
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/scanner-server.log 2>&1 &
          python tests/fetch_ocr_fixtures.py
          SCANNER_TEST_OCR=1 SCANNER_ASSET_FIXTURES=/tmp/scanner-ocr-fixtures python tests/browser_checks.py
          SCANNER_TEST_OFFLINE_OCR=1 SCANNER_ASSET_FIXTURES=/tmp/scanner-ocr-fixtures python tests/followup_checks.py
